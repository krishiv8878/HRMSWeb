<div class="login-img">
    <form [formGroup]="login" (ngSubmit)="logindata()">
        <p>Login</p>
        <div class="login-form">

            <mat-form-field appearance="outline">
                <mat-label>Email</mat-label>
                <input type="email" matInput placeholder="Enter Your Email" formControlName="email">
                <mat-error *ngIf="getControl('email')?.hasError('required')">Email is required</mat-error>
                <mat-error *ngIf="getControl('email')?.hasError('pattern')">Invalid email format</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Password</mat-label>
                <input type="password" matInput placeholder="Enter Your password" formControlName="password" maxlength="8">
                <mat-error *ngIf="getControl('password')?.hasError('minlength')"> Password must have at least 8 characters.</mat-error>
            </mat-form-field>

            <div class="login-btn">
                <button mat-flat-button>login</button>
            </div>

            <p class="login-info">Don't have an account? <a href="register">Register</a></p>
        </div>
    </form>
</div>
