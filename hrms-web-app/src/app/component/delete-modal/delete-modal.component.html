<div class="icon">
    <mat-icon>delete_outline</mat-icon>
</div>
<mat-dialog-content>Are you sure you want to delete this record?</mat-dialog-content>
<mat-dialog-actions>
    <button mat-button (click)="cancel()" style="border-radius: 0;">Cancel</button>
    <button mat-flat-button color="warn" (click)="confirmDelete()" style="border-radius: 0;">Delete</button>
</mat-dialog-actions>
