<header class="top-header-container">
  <!-- Search Input Area -->
  <div class="search-wrapper">
    <mat-icon class="search-icon">search</mat-icon>
    <input
      type="text"
      class="search-input"
      [(ngModel)]="headerSearchQuery"
      (ngModelChange)="onSearchChange($event)"
      placeholder="Search across Enterprise HRMS..."
      aria-label="Search across Enterprise HRMS"
    />
  </div>

  <!-- Right Actions & User Profile -->
  <div class="right-actions">
    <button type="button" class="action-btn" aria-label="Notifications">
      <mat-icon>notifications</mat-icon>
    </button>

    <button type="button" class="action-btn" aria-label="App Menu">
      <mat-icon>apps</mat-icon>
    </button>

    <!-- Single User Profile Trigger -->
    <div class="user-profile-trigger" [matMenuTriggerFor]="userMenu" role="button" tabindex="0">
      <img
        *ngIf="getUserAvatar()"
        [src]="getUserAvatar()"
        [alt]="getUserName()"
        class="user-avatar"
      />
      <div *ngIf="!getUserAvatar()" class="user-initials-badge">
        {{ getUserInitials() }}
      </div>
      <div class="user-meta-name">
        <span class="user-name">{{ getUserName() }}</span>
      </div>
      <mat-icon class="chevron-icon">keyboard_arrow_down</mat-icon>
    </div>

    <!-- Clean Executive User Menu -->
    <mat-menu #userMenu="matMenu" xPosition="before" class="custom-user-menu">
      <div class="menu-header">
        <strong class="menu-name">{{ getUserName() }}</strong>
        <span class="menu-role">{{ getUserRole() }}</span>
      </div>
      <mat-divider></mat-divider>
      <button mat-menu-item [routerLink]="['/index/user-profile']">
        <mat-icon>account_circle</mat-icon>
        <span>My Profile</span>
      </button>
      <button mat-menu-item (click)="resignation()">
        <mat-icon>exit_to_app</mat-icon>
        <span>Resignation</span>
      </button>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="logout()" class="logout-item">
        <mat-icon>power_settings_new</mat-icon>
        <span>Log Out</span>
      </button>
    </mat-menu>
  </div>
</header>
