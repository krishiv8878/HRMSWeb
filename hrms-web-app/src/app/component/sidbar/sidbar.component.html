<aside class="sidebar-container">
  <!-- Brand Logo & Header -->
  <div class="brand-header">
    <div class="logo-box">
      <span>HR</span>
    </div>
    <div class="brand-info">
      <h1 class="brand-name">Enterprise HR</h1>
      <span class="brand-subtitle">Management Suite</span>
    </div>
  </div>

  <!-- Navigation Menu List -->
  <div class="nav-wrapper">
    <div *ngFor="let section of sections" class="nav-section">
      <div *ngIf="section.title" class="section-title">{{ section.title }}</div>
      <nav class="nav-list">
        <a
          *ngFor="let item of section.items"
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          class="nav-item"
        >
          <span class="active-indicator"></span>
          <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      </nav>
    </div>
  </div>

  <!-- Sidebar Footer -->
  <div class="sidebar-footer">
    <button type="button" class="quick-action-btn" (click)="onQuickAction()">
      <mat-icon class="quick-icon">add</mat-icon>
      <span>Quick Action</span>
    </button>

    <div class="footer-icons-row">
      <button type="button" class="footer-btn" aria-label="Settings">
        <mat-icon>settings</mat-icon>
      </button>
      <button type="button" class="footer-btn" aria-label="Help">
        <mat-icon>help_outline</mat-icon>
      </button>
    </div>
  </div>
</aside>
