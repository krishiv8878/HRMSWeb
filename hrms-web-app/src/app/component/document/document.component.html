<div class="container-flued">
    <div class="row">
        <div class="col">
            <div class="table-menu">
                <div class="table-title">
                    <h2>Document</h2>
                </div>
                <!-- <div class="table-btn">
                    <button mat-flat-button (click)="openAddForm()" style="border-radius: 0;">add </button>
                </div> -->
            </div>
        </div>
    </div>

    <div class="document">
        <div class="left-panel">
            <h6>Employee Documents Folders</h6>
            <ul>
                <li *ngFor="let doc of documents" (click)="viewDocument(doc.id)"
                    [class.active]="selectedDocument === doc.filePath">
                    {{doc.filePath }}
                </li>
            </ul>
        </div>

        <div class="right-panel">
            <h3>Preview</h3>
            <div *ngIf="selectedDocument">
                <iframe [src]="selectedDocument" width="100%" height="500px"></iframe>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col">
            <div class="hero-img">
                <div class="data">
                    <!-- <ag-grid-angular style=" width: 100%; border: 0;" [rowData]="rowData"
                        class="ag-theme-quartz"  /> -->
                </div>
            </div>
        </div>
    </div>

</div>
