<div class="document-page-wrapper">
  <!-- Top Page Header Bar -->
  <header class="page-header">
    <div class="header-text-group">
      <h1 class="page-title">Document Management</h1>
      <p class="page-subtitle">
        Centralized repository for all enterprise documentation and policies.
      </p>
    </div>

    <div class="header-action-buttons">
      <!-- Upload Document Button -->
      <button type="button" class="btn-primary" (click)="onUploadDocument()">
        <mat-icon class="btn-icon">cloud_upload</mat-icon>
        <span>Upload Document</span>
      </button>
    </div>
  </header>

  <!-- 4-Grid Document Category Cards -->
  <section class="categories-section" aria-label="Document Categories">
    <div class="categories-grid">
      <app-category-card
        *ngFor="let category of categories"
        [category]="category"
      ></app-category-card>
    </div>
  </section>

  <!-- Main Documents Data Table -->
  <section class="table-section" aria-label="Recent Documents">
    <app-document-table [documents]="documents"></app-document-table>
  </section>
</div>
