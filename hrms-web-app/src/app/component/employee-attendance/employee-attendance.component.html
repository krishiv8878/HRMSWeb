<div class="container-fluid mt-2">
    <div class="row header-att">
        <div class="col">
            <h2>Employee Attendance</h2>
        </div>
        <div class="col" style="display: flex; justify-content: end;">
            <button mat-flat-button color="primary" (click)="onClockIn()"
                style="border-radius: 0;"><mat-icon>access_time</mat-icon> Clock In</button>
        </div>
    </div>
</div>


<div class="container-fluid mt-4">
    <div class="row mb-4">
        <div class="col-md-3 mb-2" *ngFor="let card of cards">
            <mat-card class="text-center p-4">
                <div class="icon-container mb-3 mx-auto"
                    [ngStyle]="{'background': card.bgColor, 'border': '2px solid ' + card.borderColor, 'color': card.color}">
                    <mat-icon>{{ card.icon }}</mat-icon>
                </div>

                <h3>{{ card.time }}</h3>
                <p>{{ card.title }}</p>
            </mat-card>
        </div>
    </div>

    <div class="ag-theme-quartz">
        <ag-grid-angular style="width: 100%; height: 85vh;" [rowData]="rowData" [columnDefs]="columnDefs"
            class="ag-theme-quartz" [defaultColDef]="defaultColDef" [pagination]="pagination"
            [paginationPageSize]="paginationPageSize" [paginationPageSizeSelector]="paginationPageSizeSelector">
        </ag-grid-angular>
    </div>
</div>
