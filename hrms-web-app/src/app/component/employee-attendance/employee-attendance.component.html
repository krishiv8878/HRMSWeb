<div class="table-menu">
    <div class="table-title">
        <h2>Empolyee Attendance</h2>
    </div>
    <div class="table-btn">
        <button mat-flat-button (click)="openAddForm()">add Attendance</button>
    </div>
</div>

<div class="clock-container">
    <h5>Remote Clock</h5>
    <p *ngIf="startTime">Running Time: {{ runningTime }}</p>
    <p>Total Hours: {{ totalHours?.toFixed(2) }}</p>

    <button (click)="startClock()" [disabled]="startTime !== null">Start</button>
    <button (click)="stopClock()" [disabled]="startTime === null">Stop</button>
</div>


<div class="data">
    <ag-grid-angular style="height: 85vh; width: 100%; border: 0;" [rowData]="rowData" [columnDefs]="columnDefs"
        class="ag-theme-quartz" [defaultColDef]="defaultColDef" [pagination]="pagination"
        [paginationPageSize]="paginationPageSize" [paginationPageSizeSelector]="paginationPageSizeSelector" />
</div>
