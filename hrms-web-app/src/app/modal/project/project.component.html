<div class="form">
    <form action="" [formGroup]="project" (ngSubmit)="submitdata()">
        @if (isEdit) {
        <p>edit project </p>
        }@else {
        <p>add project </p>
        }
        <div class="employee-form">
            <div class="row">
                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>clientName</mat-label>
                        <input type="text" matInput name="clientName" placeholder="Enter Your ClientName"
                            formControlName="clientName">
                            <mat-error *ngIf="getControl('clientName')?.hasError('required')">clientName is
                                required</mat-error>
                    </mat-form-field>
                </div>
                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>projectName</mat-label>
                        <input type="text" matInput name="ProjectName" placeholder="Enter Your ProjectName"
                            formControlName="projectName">
                            <mat-error *ngIf="getControl('projectName')?.hasError('required')">projectName is
                                required</mat-error>
                    </mat-form-field>
                </div>
            </div>

            <div class="row">
                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>clientRegion</mat-label>
                        <input type="text" matInput name="clientRegion" formControlName="clientRegion"
                            placeholder="Enter Your ClientRegion">
                            <mat-error *ngIf="getControl('clientRegion')?.hasError('required')">ClientRegion Is
                                Required</mat-error>
                    </mat-form-field>
                </div>
                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>description</mat-label>
                        <input type="text" matInput name="description" placeholder="Enter Your Description"
                            formControlName="description">
                            <mat-error *ngIf="getControl('description')?.hasError('required')">Description Is
                                Required</mat-error>
                    </mat-form-field>
                </div>
            </div>

            <div class="row">
                <div class="col-xl-6">
                    <mat-checkbox formControlName="isActive">Active</mat-checkbox>
                </div>
            </div>


            @if(isEdit){
            <div class="button-btn" mat-dialog-actions>
                <button mat-flat-button class="edit-btn">update</button>
                <button mat-raised-button class="cancel-btn" mat-dialog-close="false">cancel</button>
            </div>
            }@else {
            <div class="button-btn">
                <button mat-flat-button class="edit-btn" routerLink="createdDate">add</button>
                <button mat-raised-button class="cancel-btn" mat-dialog-close="false">cancel</button>
            </div>
            }


        </div>
    </form>
</div>
