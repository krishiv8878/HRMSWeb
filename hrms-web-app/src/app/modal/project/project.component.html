<div class="form">
    <form action="" [formGroup]="project" (ngSubmit)="submitdata()">
        @if (isEdit) {
        <p>edit project </p>
        }@else {
        <p>add project </p>
        }
        <div class="employee-form">
            <div class="row">
                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>clientName</mat-label>
                        <input type="text" matInput name="clientName" placeholder="Enter Your ClientName"
                            (keypress)="allowOnlyLetters($event)" (keydown.space)="$event.preventDefault()"
                            formControlName="clientName">
                    </mat-form-field>
                </div>
                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>projectName</mat-label>
                        <input type="text" matInput name="ProjectName" placeholder="Enter Your ProjectName"
                            (keypress)="allowOnlyLetters($event)" (keydown.space)="$event.preventDefault()"
                            formControlName="projectName">
                    </mat-form-field>
                </div>
            </div>

            <div class="row">
                <div class="col-xl-12">
                    <mat-form-field appearance="outline">
                        <mat-label>clientRegion</mat-label>
                        <input type="text" matInput name="clientRegion" formControlName="clientRegion"
                           (keydown.space)="$event.preventDefault()"
                            placeholder="Enter Your ClientRegion">

                    </mat-form-field>
                </div>
                <div class="col-xl-12">
                    <mat-form-field appearance="outline">
                        <mat-label>description</mat-label>
                        <!-- <input type="text" matInput name="description" placeholder="Enter Your Description" (keydown.space)="$event.preventDefault()"
                            formControlName="description"> -->
                            <textarea matInput placeholder="Leave Reason" rows="2" formControlName="description"></textarea>

                    </mat-form-field>
                </div>
            </div>

            <div class="row">
                <div class="col-xl-6">
                    <mat-checkbox formControlName="isActive">Active</mat-checkbox>
                </div>
            </div>


            @if(isEdit){
            <div class="button-btn" mat-dialog-actions>
                <button mat-flat-button class="edit-btn" style="border-radius: 0;">update</button>
                <button mat-raised-button class="cancel-btn" mat-dialog-close="false"
                    style="border-radius: 0;">cancel</button>
            </div>
            }@else {
            <div class="button-btn">
                <button mat-flat-button class="edit-btn" routerLink="createdDate" style="border-radius: 0;">add</button>
                <button mat-raised-button class="cancel-btn" mat-dialog-close="false"
                    style="border-radius: 0;">cancel</button>
            </div>
            }


        </div>
    </form>
</div>
