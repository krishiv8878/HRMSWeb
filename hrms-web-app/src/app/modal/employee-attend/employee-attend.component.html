
<h2 mat-dialog-title>Confirm Clock-In</h2>
<mat-dialog-content>
    <p>Are you sure you want to clock in?</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button  mat-flat-button (click)="onCancel()"  style="border-radius: 0;">Cancel</button>
    <button  mat-flat-button color="primary" (click)="onConfirm()"  style="border-radius: 0;">Confirm</button>

</mat-dialog-actions>
