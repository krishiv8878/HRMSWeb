<div class="form">
    <form action="" [formGroup]="CandidateForm" (ngSubmit)="submitdata()">
        @if (isEdit) {
        <p>edit candidate</p>
        <p>edit candidate</p>
        }@else {
        <p>add candidate</p>
        <p>add candidate</p>
        }


        <div class="employee-form">
            <div class="row">
                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>first name</mat-label>
                        <input type="text" matInput name="firstName" placeholder="Enter Your FirstName"
                            formControlName="firstName">
                    </mat-form-field>
                </div>
                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>last name</mat-label>
                        <input type="text" matInput name="lastName" placeholder="Enter Your LastName"
                            formControlName="lastName">
                    </mat-form-field>
                </div>
            </div>

            <div class="row">
                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>email</mat-label>
                        <input type="text" matInput name="emailAddress" placeholder="Enter Your Email"
                            formControlName="emailAddress">
                    </mat-form-field>
                </div>
                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>phone no</mat-label>
                        <input type="text" matInput name="mobileNumber" placeholder="Enter Your PhoneNo"
                        <input type="text" matInput name="mobileNumber" placeholder="Enter Your PhoneNo"
                            formControlName="mobileNumber">
                    </mat-form-field>
                </div>
            </div>

            <div class="row">
                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>totalExperience</mat-label>
                        <input type="text" matInput name="totalExperience" placeholder="Enter Your TotalExperience"
                            formControlName="totalExperience">
                    </mat-form-field>
                </div>

                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>relevantExperience</mat-label>
                        <input type="text" matInput name="RelevantExperience"
                            placeholder="Enter Your RelevantExperience" formControlName="RelevantExperience">
                    </mat-form-field>
                </div>
            </div>

            <div class="row">
                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>currentSalary</mat-label>
                        <input type="text" matInput name="currentSalary" placeholder="Enter Your CurrentSalary"
                        <input type="text" matInput name="currentSalary" placeholder="Enter Your CurrentSalary"
                            formControlName="currentSalary">
                    </mat-form-field>
                </div>

                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>noticePeriod</mat-label>
                        <!-- <input type="text" matInput name="notice Period" placeholder="Enter Your notice Period"
                            formControlName="noticePeriod"> -->
                        <mat-select formControlName="noticePeriod">
                            <mat-option value="15"> 15 day</mat-option>
                            <mat-option value="2"> 1 months</mat-option>
                            <mat-option value="3"> 3 months</mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
            </div>

            <div class=" row">
                <div class="col">
                    <mat-form-field appearance="outline">
                        <mat-label>expected Salary</mat-label>
                        <input type="number" matInput name="expectedSalary" placeholder="Enter Your Expected Salary"
                            formControlName="expectedSalary">
                    </mat-form-field>
                    <mat-checkbox formControlName="isActive">Active</mat-checkbox>
                </div>
            </div>

            @if(isEdit){
            <div class="button-btn" mat-dialog-actions>
                <button mat-flat-button class="edit-btn">update</button>
                <button mat-raised-button class="cancel-btn" mat-dialog-close="false">cancel</button>
            </div>
            }@else {
            <div class="button-btn">
                <button mat-flat-button class="edit-btn" routerLink="createdDate">add</button>
                <button mat-raised-button class="cancel-btn" mat-dialog-close="false">cancel</button>
            </div>
            }

        </div>
    </form>
</div>
