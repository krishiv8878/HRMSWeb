<div class="form">
    <form action="" [formGroup]="CandidateForm" (ngSubmit)="submitdata()">
        @if (isEdit) {
        <p>edit candidate</p>
        }@else {
        <p>add candidate</p>
        }

        <div class="employee-form">
            <div class="row">
                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>first name</mat-label>
                        <input type="text" matInput name="firstName" placeholder="Enter FirstName"
                            (keypress)="allowOnlyLetters($event)" formControlName="firstName">
                    </mat-form-field>
                </div>
                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>last name</mat-label>
                        <input type="text" matInput name="lastName" placeholder="Enter LastName"
                            (keypress)="allowOnlyLetters($event)" formControlName="lastName">
                    </mat-form-field>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <mat-form-field appearance="outline">
                        <mat-label>email</mat-label>
                        <input type="text" matInput name="emailAddress" placeholder="Enter Email"
                            formControlName="emailAddress">
                    </mat-form-field>
                </div>

            </div>

            <div class="row">
                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>phone no</mat-label>
                        <input type="text" matInput name="mobileNumber" placeholder="Enter PhoneNo"
                            (keypress)="allowOnlyNumbers($event)" formControlName="mobileNumber" maxlength="10">
                    </mat-form-field>
                </div>

                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>totalExperience (year)</mat-label>
                        <input type="text" matInput name="totalExperience" placeholder=" Total Experience"
                            (keypress)="allowOnlyNumbers($event)" formControlName="totalExperience">
                    </mat-form-field>
                </div>
            </div>

            <div class="row">
                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>relevantExperience (year)</mat-label>
                        <input type="text" matInput name="RelevantExperience" (keypress)="allowOnlyNumbers($event)"
                            placeholder="Relevant Experience" formControlName="relevantExperience">
                    </mat-form-field>
                </div>

                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>currentSalary (Annually)</mat-label>
                        <input type="text" matInput name="currentSalary" placeholder="Current Salary"
                            (keypress)="allowOnlyNumbers($event)" formControlName="currentSalary">
                    </mat-form-field>
                </div>
            </div>

            <div class=" row">
                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>noticePeriod (days)</mat-label>
                        <mat-select formControlName="noticePeriod" [(value)]="numbermenu">
                            <mat-option *ngFor="let number of numbers" [value]="number"> {{number}}</mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>

                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>expected Salary (Annually)</mat-label>
                        <input type="text" matInput name="expectedSalary" placeholder="Expected Salary"
                            (keypress)="allowOnlyNumbers($event)" formControlName="expectedSalary">
                    </mat-form-field>
                </div>

                <div class="row">
                    <div class="col">
                        <mat-checkbox formControlName="isActive">Active</mat-checkbox>
                    </div>
                </div>
            </div>

            @if(isEdit){
            <div class="button-btn" mat-dialog-actions>
                <button mat-flat-button class="edit-btn" style="border-radius: 0;">update</button>
                <button mat-raised-button class="cancel-btn" mat-dialog-close="false"
                    style="border-radius: 0;">cancel</button>
            </div>
            }@else {
            <div class="button-btn">
                <button mat-flat-button class="edit-btn" routerLink="createdDate" style="border-radius: 0;">add</button>
                <button mat-raised-button class="cancel-btn" mat-dialog-close="false"
                    style="border-radius: 0;">cancel</button>
            </div>
            }

        </div>
    </form>
</div>
