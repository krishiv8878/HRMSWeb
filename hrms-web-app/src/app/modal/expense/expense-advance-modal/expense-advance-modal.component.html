<div class="expense-modal-container">
  <div class="modal-header">
    <div class="header-info">
      <div class="header-icon advance-icon">
        <mat-icon>payments</mat-icon>
      </div>
      <div>
        <h2>Request Cash Advance</h2>
        <p class="subtitle">Request advance funds for upcoming business travel or client visits</p>
      </div>
    </div>
    <button type="button" class="modal-close-icon-btn" (click)="close()" aria-label="Close">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <form [formGroup]="advanceForm" (ngSubmit)="submit()" class="modal-body">
    <div class="form-grid-2">
      <div class="form-group full-width">
        <label>Advance Amount (₹) <span class="required">*</span></label>
        <input type="number" formControlName="requestedAmount" placeholder="e.g. 15000" min="100" />
        <span class="error-msg" *ngIf="advanceForm.get('requestedAmount')?.touched && advanceForm.get('requestedAmount')?.hasError('required')">
          Advance amount is required
        </span>
      </div>

      <div class="form-group">
        <label>Expected Travel Start Date <span class="required">*</span></label>
        <input type="date" formControlName="expectedTravelStartDate" />
      </div>

      <div class="form-group">
        <label>Expected Travel End Date</label>
        <input type="date" formControlName="expectedTravelEndDate" />
      </div>

      <div class="form-group full-width">
        <label>Reason / Business Purpose <span class="required">*</span></label>
        <textarea formControlName="reason" rows="3" placeholder="e.g. Flight, hotel stay, and transport for client meetings in Mumbai"></textarea>
        <span class="error-msg" *ngIf="advanceForm.get('reason')?.touched && advanceForm.get('reason')?.hasError('required')">
          Reason is required
        </span>
      </div>
    </div>

    <div class="advance-info-note">
      <mat-icon>info</mat-icon>
      <div>
        <strong>Policy Note:</strong> Once approved and disbursed by Finance, this cash advance will be auto-adjusted against your subsequent expense claim reports.
      </div>
    </div>
  </form>

  <div class="modal-footer">
    <button type="button" class="btn-cancel" (click)="close()" [disabled]="isSubmitting">Cancel</button>
    <button type="button" class="btn-submit" (click)="submit()" [disabled]="isSubmitting">
      <mat-icon>send</mat-icon> Submit Request
    </button>
  </div>
</div>
