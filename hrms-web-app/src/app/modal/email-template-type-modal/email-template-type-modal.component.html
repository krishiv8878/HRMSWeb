<div class="template-type-modal-container">
  <!-- Modal Header -->
  <div class="modal-header">
    <div class="header-title-box">
      <div class="header-icon-badge">
        <mat-icon>{{ data.isEdit ? 'edit_note' : 'add_circle' }}</mat-icon>
      </div>
      <div>
        <h2 class="modal-title">{{ data.isEdit ? 'Edit Template Category / Type' : 'Create Template Category / Type' }}</h2>
        <p class="modal-subtitle">Configure email trigger type to group and dispatch notifications</p>
      </div>
    </div>
    <button type="button" class="btn-close-modal" (click)="close()" aria-label="Close modal">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Modal Form -->
  <form [formGroup]="typeForm" (ngSubmit)="onSubmit()" class="modal-form">
    <div class="form-body">
      <!-- Template Type Name -->
      <div class="form-group">
        <label for="templateType" class="form-label">
          Template Type Name <span class="required">*</span>
        </label>
        <input
          id="templateType"
          type="text"
          formControlName="templateType"
          placeholder="e.g. Leave Approval, Welcome Onboarding, Payslip Ready"
          class="form-control"
          [class.is-invalid]="typeForm.get('templateType')?.invalid && typeForm.get('templateType')?.touched"
        />
        <div class="error-feedback" *ngIf="typeForm.get('templateType')?.invalid && typeForm.get('templateType')?.touched">
          Template type name is required.
        </div>
      </div>

      <!-- Description -->
      <div class="form-group">
        <label for="description" class="form-label">
          Description / Trigger Scenario <span class="required">*</span>
        </label>
        <textarea
          id="description"
          formControlName="description"
          rows="3"
          placeholder="Describe when this email notification is dispatched (e.g. Sent to the employee immediately when manager approves time off)."
          class="form-control textarea"
          [class.is-invalid]="typeForm.get('description')?.invalid && typeForm.get('description')?.touched"
        ></textarea>
        <div class="error-feedback" *ngIf="typeForm.get('description')?.invalid && typeForm.get('description')?.touched">
          Description is required.
        </div>
      </div>
    </div>

    <!-- Modal Footer Actions -->
    <div class="modal-footer">
      <button type="button" class="btn-cancel" (click)="close()" [disabled]="isSubmitting">Cancel</button>
      <button type="submit" class="btn-submit" [disabled]="isSubmitting">
        <mat-icon *ngIf="!isSubmitting">check</mat-icon>
        <mat-icon *ngIf="isSubmitting" class="spin-icon">sync</mat-icon>
        <span>{{ isSubmitting ? 'Saving...' : (data.isEdit ? 'Save Changes' : 'Create Category') }}</span>
      </button>
    </div>
  </form>
</div>
