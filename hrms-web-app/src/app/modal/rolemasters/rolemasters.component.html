<div class="form">
    <form action="" [formGroup]="roledateForm" (ngSubmit)="submitdata()">
        @if (isEdit) {
        <p>edit roleMaster</p>
        }@else {
        <p>add roleMaster</p>
        }

        <div class="employee-form">
            <div class="row">
                <div class="col">
                    <mat-form-field appearance="outline">
                        <mat-label>role name</mat-label>
                        <input type="text" matInput name="roleName" placeholder="Enter RoletName"
                            formControlName="roleName">
                            <mat-error *ngIf="getControl('roleName')?.hasError('required')">roleName is
                                required</mat-error>
                    </mat-form-field>
                </div>
            </div>

            <div class="row">
                <div class="col-xl-6">
                    <mat-checkbox formControlName="isActive">Active</mat-checkbox>
                </div>
            </div>

            @if(isEdit){
            <div class="button-btn" mat-dialog-actions>
                <button mat-flat-button class="edit-btn">update</button>
                <button mat-raised-button class="cancel-btn" mat-dialog-close="false">cancel</button>
            </div>
            }@else {
            <div class="button-btn">
                <button mat-flat-button class="edit-btn" routerLink="createdDate">add</button>
                <button mat-raised-button class="cancel-btn" mat-dialog-close="false">cancel</button>
            </div>
            }

        </div>
    </form>
</div>
