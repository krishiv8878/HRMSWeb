<div class="form">
    <form action="" [formGroup]="roledateForm" (ngSubmit)="submitdata()">
        @if (isEdit) {
        <p>edit role</p>
        }@else {
        <p>add role</p>
        }

        <div class="employee-form">
            <div class="row">
                <div class="col-xl-12">
                    <mat-form-field appearance="outline">
                        <mat-label>role name</mat-label>
                        <input type="text" matInput name="roleName" placeholder="Enter RoleName" (keypress)="allowOnlyLetters($event)"
                            formControlName="roleName">
                    </mat-form-field>
                </div>
            </div>

            <div class="row">
                <div class="col-xl-6">
                    <mat-checkbox formControlName="isActive">Active</mat-checkbox>
                </div>
            </div>

            @if(isEdit){
            <div class="button-btn" mat-dialog-actions>
                <button mat-flat-button class="edit-btn"  style="border-radius: 0;">update</button>
                <button mat-raised-button class="cancel-btn" mat-dialog-close="false"  style="border-radius: 0;">cancel</button>
            </div>
            }@else {
            <div class="button-btn">
                <button mat-flat-button class="edit-btn" routerLink="createdDate"  style="border-radius: 0;">add</button>
                <button mat-raised-button class="cancel-btn" mat-dialog-close="false"  style="border-radius: 0;">cancel</button>
            </div>
            }

        </div>
    </form>
</div>
