<div class="role-modal-container">
  <!-- Modal Header Bar -->
  <div class="modal-header">
    <div class="header-left">
      <div class="icon-badge">
        <mat-icon>{{ isEdit ? 'security' : 'add_moderator' }}</mat-icon>
      </div>
      <div class="header-text">
        <h2 class="modal-title">{{ isEdit ? 'Edit Security Role' : 'Add New Role' }}</h2>
        <p class="modal-subtitle">Configure authorization tier, portal permissions, and access privileges.</p>
      </div>
    </div>
    <button type="button" class="close-btn" (click)="closeModal()" aria-label="Close modal">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Form Body -->
  <form [formGroup]="roledateForm" (ngSubmit)="submitdata()" class="role-form-body">
    <!-- Role Name Field -->
    <div class="form-group">
      <label class="field-label">Role Definition Title <span class="required">*</span></label>
      <div class="input-wrapper">
        <mat-icon class="input-icon">badge</mat-icon>
        <input
          type="text"
          formControlName="roleName"
          placeholder="e.g. Super Admin, HR Manager, Team Lead, Employee"
          class="custom-input"
          (keypress)="allowOnlyLetters($event)"
        />
      </div>
      <span class="error-text" *ngIf="getControl('roleName')?.touched && getControl('roleName')?.invalid">
        Role name is required
      </span>
    </div>

    <!-- Active Status Card -->
    <div class="form-group-checkbox">
      <label class="checkbox-label">
        <input type="checkbox" formControlName="isActive" class="custom-checkbox" />
        <span class="label-title">Active Role Status</span>
      </label>
      <p class="checkbox-hint">Enables this role to be assigned to personnel and enforced across HRMS modules.</p>
    </div>

    <!-- Modal Footer Actions -->
    <div class="modal-footer">
      <button type="button" class="btn-cancel" (click)="closeModal()">
        Cancel
      </button>
      <button type="submit" class="btn-submit">
        <mat-icon>{{ isEdit ? 'save' : 'add_moderator' }}</mat-icon>
        <span>{{ isEdit ? 'Update Role' : 'Save Role' }}</span>
      </button>
    </div>
  </form>
</div>
