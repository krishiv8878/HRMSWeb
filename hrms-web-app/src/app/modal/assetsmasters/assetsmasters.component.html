<div class="asset-modal-card">
  <!-- Modal Header -->
  <div class="modal-header">
    <div class="header-title">
      <div class="icon-box">
        <mat-icon>inventory_2</mat-icon>
      </div>
      <div>
        <h2>{{ isEdit ? 'Edit Corporate Asset' : 'Add New Asset' }}</h2>
        <span class="subtitle">Enter equipment hardware details and assignment location.</span>
      </div>
    </div>
    <button type="button" class="close-icon-btn" (click)="onCancel()" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Modal Form Body -->
  <form [formGroup]="assetForm" (ngSubmit)="submitdata()" class="modal-form-body">
    <!-- Model Name -->
    <div class="form-field-group">
      <label class="form-label">Asset / Model Name <span class="required">*</span></label>
      <input
        type="text"
        formControlName="modelName"
        placeholder="e.g. MacBook Pro 16&quot;"
        class="form-input"
      />
    </div>

    <!-- Category & Specifications Grid -->
    <div class="form-row">
      <!-- Asset Type / Category -->
      <div class="form-field-group">
        <label class="form-label">Asset Type <span class="required">*</span></label>
        <select formControlName="assetType" class="form-select">
          <option *ngFor="let type of assetTypes" [value]="type">{{ type }}</option>
        </select>
      </div>

      <!-- Specifications -->
      <div class="form-field-group">
        <label class="form-label">Specifications / Subtitle <span class="required">*</span></label>
        <input
          type="text"
          formControlName="specifications"
          placeholder="e.g. Laptop • 2023 M2 Max"
          class="form-input"
        />
      </div>
    </div>

    <!-- Assigned Employee & Status Grid -->
    <div class="form-row">
      <!-- Assigned To -->
      <div class="form-field-group">
        <label class="form-label">Assigned Employee <span class="required">*</span></label>
        <select formControlName="assignedTo" class="form-select">
          <option *ngFor="let emp of employees" [value]="emp">{{ emp }}</option>
        </select>
      </div>

      <!-- Status -->
      <div class="form-field-group">
        <label class="form-label">Status <span class="required">*</span></label>
        <select formControlName="status" class="form-select">
          <option *ngFor="let st of statusList" [value]="st">{{ st }}</option>
        </select>
      </div>
    </div>

    <!-- Location -->
    <div class="form-field-group">
      <label class="form-label">Office Location / Desk <span class="required">*</span></label>
      <select formControlName="location" class="form-select">
        <option *ngFor="let loc of locations" [value]="loc">{{ loc }}</option>
      </select>
    </div>

    <!-- Form Footer Actions -->
    <div class="modal-footer">
      <button type="button" class="btn-cancel" (click)="onCancel()">Cancel</button>
      <button type="submit" class="btn-submit">
        <mat-icon>check</mat-icon>
        <span>{{ isEdit ? 'Save Changes' : 'Add Asset' }}</span>
      </button>
    </div>
  </form>
</div>
