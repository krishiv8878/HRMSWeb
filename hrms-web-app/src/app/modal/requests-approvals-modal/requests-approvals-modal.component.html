
<mat-dialog-content style="font-size: 1rem; text-align: center; font-weight: 500;">Are you sure you want to {{data.isApproved ? 'approve' : 'reject'}} this leave request ?</mat-dialog-content>
<mat-dialog-actions>
    <button mat-button (click)="cancel()" style="border-radius: 0;">Cancel</button>
    <button mat-flat-button color="warn" (click)="confirmSend()" style="border-radius: 0;">{{data.isApproved ? 'Approve' : 'Reject'}}</button>
</mat-dialog-actions>
