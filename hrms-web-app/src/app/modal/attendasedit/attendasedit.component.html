<div class="regularization-modal-container">
  <!-- Modal Header Bar -->
  <div class="modal-header">
    <div class="header-left">
      <div class="icon-badge">
        <mat-icon>edit_calendar</mat-icon>
      </div>
      <div class="header-text">
        <h2 class="modal-title">Request Attendance Regularization</h2>
        <p class="modal-subtitle">Adjust in/out punch logs and submit for manager approval.</p>
      </div>
    </div>
    <button type="button" class="close-btn" (click)="closeDialog()" aria-label="Close modal">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Form Body -->
  <form [formGroup]="attendaseform" (ngSubmit)="submitdata()" class="regularization-form-body">
    <!-- Selected Date -->
    <div class="form-group">
      <label class="field-label">Selected Date</label>
      <div class="input-wrapper">
        <mat-icon class="input-icon">event</mat-icon>
        <input
          matInput
          [matDatepicker]="picker"
          formControlName="selectedDate"
          class="custom-input"
        />
        <mat-datepicker-toggle matSuffix [for]="picker" class="picker-toggle"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </div>
    </div>

    <!-- Time Adjustments Row -->
    <div class="form-divider">
      <span>PUNCH TIME ADJUSTMENT</span>
    </div>

    <div class="form-row-2">
      <div class="form-group">
        <label class="field-label">Adjusted In-Time <span class="required">*</span></label>
        <div class="input-wrapper">
          <mat-icon class="input-icon">login</mat-icon>
          <input
            type="time"
            formControlName="clockIn"
            class="custom-input"
          />
        </div>
      </div>

      <div class="form-group">
        <label class="field-label">Adjusted Out-Time <span class="required">*</span></label>
        <div class="input-wrapper">
          <mat-icon class="input-icon">logout</mat-icon>
          <input
            type="time"
            formControlName="clockOut"
            class="custom-input"
          />
        </div>
      </div>
    </div>

    <!-- Note & Justification -->
    <div class="form-group">
      <label class="field-label">Regularization Reason / Note <span class="required">*</span></label>
      <div class="input-wrapper textarea-wrapper">
        <textarea
          formControlName="Reason"
          placeholder="Please explain the reason for punch adjustment (e.g. Biometric device failure, client site visit)..."
          rows="3"
          class="custom-textarea"
        ></textarea>
      </div>
    </div>

    <!-- Modal Footer Actions -->
    <div class="modal-footer">
      <button type="button" class="btn-cancel" (click)="closeDialog()">
        Cancel
      </button>
      <button type="submit" class="btn-submit">
        <mat-icon>send</mat-icon>
        Submit Request
      </button>
    </div>
  </form>
</div>
