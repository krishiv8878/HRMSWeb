<div class="holiday-modal-container">
  <!-- Modal Header Bar -->
  <div class="modal-header">
    <div class="header-left">
      <div class="icon-badge">
        <mat-icon>celebration</mat-icon>
      </div>
      <div class="header-text">
        <h2 class="modal-title">{{ isEdit ? 'Edit Corporate Holiday' : 'Add Corporate Holiday' }}</h2>
        <p class="modal-subtitle">Configure official company holiday schedule, date, and calendar observance.</p>
      </div>
    </div>
    <button type="button" class="close-btn" mat-dialog-close="false" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Modal Form Body -->
  <form [formGroup]="Holidayform" (ngSubmit)="submitdata()" class="holiday-form-body">
    <!-- Holiday Name -->
    <div class="form-group">
      <label class="field-label">Holiday Title / Occasion <span class="required">*</span></label>
      <div class="input-wrapper">
        <mat-icon class="input-icon">celebration</mat-icon>
        <input
          type="text"
          formControlName="holidayName"
          placeholder="e.g. Independence Day, New Year's Day, Diwali"
          class="custom-input"
        />
      </div>
    </div>

    <!-- Holiday Date -->
    <div class="form-group">
      <label class="field-label">Observance Date <span class="required">*</span></label>
      <div class="input-wrapper">
        <mat-icon class="input-icon">event</mat-icon>
        <input
          matInput
          [matDatepicker]="picker"
          formControlName="holidayDate"
          placeholder="Select holiday date"
          class="custom-input custom-date-input"
        />
        <mat-datepicker-toggle matIconSuffix [for]="picker" class="picker-toggle-btn"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </div>
    </div>

    <!-- Description -->
    <div class="form-group">
      <label class="field-label">Description & Observance Guidelines <span class="required">*</span></label>
      <div class="input-wrapper-textarea">
        <mat-icon class="input-icon-textarea">notes</mat-icon>
        <textarea
          formControlName="description"
          rows="3"
          placeholder="Enter holiday details, office closure schedule, and eligibility guidelines..."
          class="custom-textarea"
        ></textarea>
      </div>
    </div>

    <!-- Active Holiday Switch Card -->
    <div class="status-card-group">
      <div class="status-text-left">
        <label class="status-title">Active Calendar Observance</label>
        <p class="status-desc">Display this holiday on the workforce attendance roster and company calendar.</p>
      </div>

      <label class="switch-control">
        <input type="checkbox" formControlName="isActive" />
        <span class="slider-round"></span>
      </label>
    </div>

    <!-- Modal Footer Actions -->
    <div class="modal-footer">
      <button type="button" class="btn-cancel" mat-dialog-close="false">
        Cancel
      </button>
      <button type="submit" class="btn-submit">
        <mat-icon>{{ isEdit ? 'save' : 'add_task' }}</mat-icon>
        <span>{{ isEdit ? 'Update Holiday' : 'Add Holiday' }}</span>
      </button>
    </div>
  </form>
</div>
