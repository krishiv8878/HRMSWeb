<div class="form">
    <form action="" [formGroup]="Holidayform" (ngSubmit)="submitdata()">
        @if (isEdit) {
        <p>Edit Holiday</p>
        }@else {
        <p>Add Holiday </p>
        }
        <div class="holiday-form">
            <div class="row">
                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>Holiday Name</mat-label>
                        <input type="text" matInput name="holidayName" placeholder="Enter Your HolidayName"
                            formControlName="holidayName">
                            <mat-error *ngIf="getControl('holidayName')?.hasError('required')">HolidayName Is
                                Required</mat-error>
                    </mat-form-field>
                </div>

                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>Description</mat-label>                      
                        <input type="text" matInput name="holidayName" placeholder="Enter Your Description"
                        formControlName="description">
                        <mat-error *ngIf="getControl('description')?.hasError('required')">Description Is
                            Required</mat-error>
                    </mat-form-field>
                </div>
            </div>


            <div class="row">
                <div class="col-xl-6">
                    <mat-checkbox formControlName="isActive">Active</mat-checkbox>
                </div>
            </div>


            @if(isEdit){
            <div class="button-btn" mat-dialog-actions>
                <button mat-flat-button class="edit-btn">Update</button>
                <button mat-raised-button class="cancel-btn" mat-dialog-close="false">Cancel</button>
            </div>
            }@else {
            <div class="button-btn">
                <button mat-flat-button class="edit-btn" routerLink="createdDate">Add</button>
                <button mat-raised-button class="cancel-btn" mat-dialog-close="false">Cancel</button>
            </div>
            }


        </div>
    </form>
</div>
