<div class="form">
    <form action="" [formGroup]="Employeeform" (ngSubmit)="submitdata()">
        @if (isEdit) {
        <p>edit employee </p>
        <p>edit employee </p>
        }@else {
        <p>add employee </p>
        <p>add employee </p>
        }
        <div class="employee-form">
            <div class="row">
                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>first name</mat-label>
                        <input type="text" matInput name="firstName" placeholder="Enter Your FirstName"
                            formControlName="firstName">
                    </mat-form-field>
                </div>

                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>last name</mat-label>
                        <input type="text" matInput name="lastName" placeholder="Enter Your LastName"
                            formControlName="lastName">
                    </mat-form-field>
                </div>

            </div>

            <div class="row">
                <div class="col">
                    <mat-form-field appearance="outline">
                        <mat-label>email</mat-label>
                        <input type="text" matInput name="emailAddress" placeholder="Enter Your Email"
                            formControlName="emailAddress">
                    </mat-form-field>
                </div>
            </div>
            
            <div class="row">
                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>joining date</mat-label>
                        <input matInput [matDatepicker]="picker" formControlName="dateOfJoining">
                        <mat-hint>MM/DD/YYYY</mat-hint>
                        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                        <mat-datepicker #picker></mat-datepicker>
                    </mat-form-field>
                </div>
                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>phoneNo</mat-label>
                        <input type="text" matInput name="mobileNumber" placeholder="Enter Your PhoneNo"
                            formControlName="mobileNumber">
                    </mat-form-field>
                </div>
            </div>

            <div class="row">
                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>permanent Address</mat-label>
                        <input type="text" matInput name="permanent Address" placeholder="Enter Your Permanet Address"
                            formControlName="permanentAddress">
                    </mat-form-field>
                </div>
                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>current Address</mat-label>
                        <input type="text" matInput name="current Address" placeholder="Enter Your Current Address"
                            formControlName="currentAddress">
                    </mat-form-field>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <mat-radio-group formControlName="gender">
                        <mat-label><b>Gender</b></mat-label>
                        <mat-radio-button value="male">Male</mat-radio-button>
                        <mat-radio-button value="female">Female</mat-radio-button>
                    </mat-radio-group>
                    <mat-checkbox formControlName="isActive">Active</mat-checkbox>
                </div>
            </div>

            <!-- <div class="row">
                <div class="col">
                    <mat-form-field appearance="outline">
                        <mat-label>joining date</mat-label>
                        <input matInput [matDatepicker]="picker" formControlName="dateOfJoining">
                        <mat-hint>MM/DD/YYYY</mat-hint>
                        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                        <mat-datepicker #picker></mat-datepicker>
                    </mat-form-field>
                </div>
            </div> -->


            @if(isEdit){
            <div class="button-btn" mat-dialog-actions>
                <button mat-flat-button class="edit-btn">update</button>
                <button mat-raised-button class="cancel-btn" mat-dialog-close="false">cancel</button>
            </div>
            }@else {
            <div class="button-btn">
                <button mat-flat-button class="edit-btn" routerLink="createdDate">add</button>
                <button mat-raised-button class="cancel-btn" mat-dialog-close="false">cancel</button>
            </div>
            }


        </div>
    </form>
</div>
