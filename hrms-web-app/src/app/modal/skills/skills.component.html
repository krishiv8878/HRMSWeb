<div class="form">
    <form action="" [formGroup]="Skillform" (ngSubmit)="submitdata()">
        @if (isEdit) {
        <p>edit Skill </p>
        }@else {
        <p>add Skill </p>
        }
        <div class="employee-form">
            <div class="row">
                <div class="col-xl-12">
                    <mat-form-field appearance="outline">
                        <mat-label>Skill</mat-label>
                        <input type="text" matInput name="skill" placeholder="Enter Your Skill"
                            formControlName="skillName">
                            <mat-error *ngIf="getControl('skillName')?.hasError('required')">skillName is
                                required</mat-error>
                    </mat-form-field>
                </div>
            </div>            
            

            <div class="row">
                <div class="col-xl-6">
                    <mat-checkbox formControlName="isActive">Active</mat-checkbox>
                </div>
            </div>


            @if(isEdit){
            <div class="button-btn" mat-dialog-actions>
                <button mat-flat-button class="edit-btn">update</button>
                <button mat-raised-button class="cancel-btn" mat-dialog-close="false">cancel</button>
            </div>
            }@else {
            <div class="button-btn">
                <button mat-flat-button class="edit-btn" routerLink="createdDate">add</button>
                <button mat-raised-button class="cancel-btn" mat-dialog-close="false">cancel</button>
            </div>
            }


        </div>
    </form>
</div>
