<div class="designation-modal-container">
  <!-- Modal Header Bar -->
  <div class="modal-header">
    <div class="header-left">
      <div class="icon-badge">
        <mat-icon>{{ isEdit ? 'work' : 'add_business' }}</mat-icon>
      </div>
      <div class="header-text">
        <h2 class="modal-title">{{ isEdit ? 'Edit Job Designation' : 'Add New Designation' }}</h2>
        <p class="modal-subtitle">Define corporate job titles, departmental domains, and ladder tiers.</p>
      </div>
    </div>
    <button type="button" class="close-btn" (click)="closeModal()" aria-label="Close modal">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Form Body -->
  <form [formGroup]="designation" (ngSubmit)="submitdata()" class="designation-form-body">
    <!-- Designation Name Field -->
    <div class="form-group">
      <label class="field-label">Job Title / Designation Name <span class="required">*</span></label>
      <div class="input-wrapper">
        <mat-icon class="input-icon">work_outline</mat-icon>
        <input
          type="text"
          formControlName="designationName"
          placeholder="e.g. Senior Software Architect, Product Lead, HR Partner"
          class="custom-input"
          (keypress)="allowOnlyLetters($event)"
        />
      </div>
      <span class="error-text" *ngIf="getControl('designationName')?.touched && getControl('designationName')?.invalid">
        Designation title is required
      </span>
    </div>

    <!-- Active Status Card -->
    <div class="form-group-checkbox">
      <label class="checkbox-label">
        <input type="checkbox" formControlName="isActive" class="custom-checkbox" />
        <span class="label-title">Active Designation Status</span>
      </label>
      <p class="checkbox-hint">Enables this designation to be assigned in employee onboarding and job postings.</p>
    </div>

    <!-- Modal Footer Actions -->
    <div class="modal-footer">
      <button type="button" class="btn-cancel" (click)="closeModal()">
        Cancel
      </button>
      <button type="submit" class="btn-submit">
        <mat-icon>{{ isEdit ? 'save' : 'add_business' }}</mat-icon>
        <span>{{ isEdit ? 'Update Designation' : 'Save Designation' }}</span>
      </button>
    </div>
  </form>
</div>
