<div class="education-modal-container">
  <!-- Modal Header Bar -->
  <div class="modal-header">
    <div class="header-left">
      <div class="icon-badge">
        <mat-icon>school</mat-icon>
      </div>
      <div class="header-text">
        <h2 class="modal-title">Academic & Educational Qualifications</h2>
        <p class="modal-subtitle">Document degrees, university credentials, graduation years, and academic honors.</p>
      </div>
    </div>
    <div class="header-actions-right">
      <!-- Top Add Button -->
      <button type="button" class="btn-top-add" (click)="addEducation()" title="Add another academic qualification">
        <mat-icon>add</mat-icon>
        <span>Add Degree</span>
      </button>
      <button type="button" class="close-btn" (click)="closeModal()" aria-label="Close modal">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>

  <!-- Form Body -->
  <form (ngSubmit)="submitEducationDetails()" class="education-form-body">
    <!-- Education Entries Loop -->
    <div *ngFor="let edu of educationList; let i = index" class="education-card-block">
      <div class="entry-header">
        <div class="entry-badge">
          <span class="dot"></span>
          <span>QUALIFICATION #{{ i + 1 }} {{ i === 0 ? '(HIGHEST DEGREE)' : '' }}</span>
        </div>
        <button
          *ngIf="educationList.length > 1"
          type="button"
          class="btn-remove-entry"
          (click)="removeEducation(i)"
          title="Remove this qualification"
        >
          <mat-icon>delete_outline</mat-icon>
          <span>Remove</span>
        </button>
      </div>

      <!-- Degree Title -->
      <div class="form-group">
        <label class="field-label">Degree Title & Major Specialization <span class="required">*</span></label>
        <div class="input-wrapper">
          <mat-icon class="input-icon">school</mat-icon>
          <input
            type="text"
            [(ngModel)]="edu.degree"
            [name]="'degree_' + i"
            placeholder="e.g. Master of Science in Computer Science, B.Tech, MBA"
            class="custom-input"
            required
          />
        </div>
      </div>

      <!-- Institution Name -->
      <div class="form-group">
        <label class="field-label">University / College / Accredited Institution <span class="required">*</span></label>
        <div class="input-wrapper">
          <mat-icon class="input-icon">account_balance</mat-icon>
          <input
            type="text"
            [(ngModel)]="edu.university"
            [name]="'university_' + i"
            placeholder="e.g. Massachusetts Institute of Technology (MIT), Stanford University"
            class="custom-input"
            required
          />
        </div>
      </div>

      <!-- Year & GPA -->
      <div class="form-row-2">
        <div class="form-group">
          <label class="field-label">Graduation Year / Year of Passing <span class="required">*</span></label>
          <div class="input-wrapper">
            <mat-icon class="input-icon">event</mat-icon>
            <input
              type="text"
              [(ngModel)]="edu.yearOfPassing"
              [name]="'year_' + i"
              placeholder="e.g. 2018"
              class="custom-input"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label class="field-label">Aggregate Score / GPA / Grade <span class="required">*</span></label>
          <div class="input-wrapper">
            <mat-icon class="input-icon">military_tech</mat-icon>
            <input
              type="text"
              [(ngModel)]="edu.percentage"
              [name]="'score_' + i"
              placeholder="e.g. 3.92 GPA / 88.5% / First Class Honors"
              class="custom-input"
              required
            />
          </div>
        </div>
      </div>
    </div>

    <!-- Big Add Another Qualification Button -->
    <button type="button" class="btn-add-another-block" (click)="addEducation()">
      <mat-icon>add_circle_outline</mat-icon>
      <span>Add Another Academic Qualification</span>
    </button>

    <!-- Modal Footer Actions -->
    <div class="modal-footer">
      <button type="button" class="btn-cancel" (click)="closeModal()">
        Cancel
      </button>
      <button type="submit" class="btn-submit">
        <mat-icon>save</mat-icon>
        <span>Save All Qualifications</span>
      </button>
    </div>
  </form>
</div>
