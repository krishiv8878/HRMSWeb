<div class="form">
    <form action="" [formGroup]="profileForm" (ngSubmit)="submitProfile()">
        <p>Profile Information</p>

        <div class="profileInfo-form">
            <div class="image-container">
                <img [src]="selectedImage || defaultImage" alt="User Image" class="user-image" />
                <button type="button" class="edit-btnimg" (click)="fileInput.click()">
                    <mat-icon>edit</mat-icon>
                </button>
                <input #fileInput hidden type="file" accept="image/*" (change)="onFileSelected($event)">
            </div>

            <div class="row mt-4">
                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>First Name</mat-label>
                        <input type="text" matInput name="firstName" placeholder="Enter First Name"
                            formControlName="firstName">
                    </mat-form-field>
                </div>
                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>Last Name</mat-label>
                        <input type="text" matInput name="lastName" placeholder="Enter Last Name"
                            formControlName="lastName">
                    </mat-form-field>
                </div>
            </div>

            <div class="row">
                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>Email</mat-label>
                        <input type="email" matInput name="emailAddress" placeholder="Enter Email"
                            formControlName="emailAddress">
                    </mat-form-field>
                </div>
                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>Phone Number</mat-label>
                        <input type="text" matInput name="mobileNumber" placeholder="Enter Phone Number"
                            formControlName="mobileNumber">
                    </mat-form-field>
                </div>
            </div>

            <div class="row">
                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>Joining Date</mat-label>
                        <input matInput [matDatepicker]="picker" formControlName="dateOfJoining">
                        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                        <mat-datepicker #picker></mat-datepicker>
                    </mat-form-field>
                </div>
                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>Birthday</mat-label>
                        <input matInput [matDatepicker]="birthdayPicker" formControlName="dateOfBirth">
                        <mat-datepicker-toggle matIconSuffix [for]="birthdayPicker"></mat-datepicker-toggle>
                        <mat-datepicker #birthdayPicker></mat-datepicker>
                    </mat-form-field>
                </div>
            </div>

            <div class="row">
                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>Address</mat-label>
                        <input type="text" matInput name="permanentAddress" placeholder="Enter Permanent Address"
                            formControlName="currentAddress">
                    </mat-form-field>
                </div>
                <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>Gender</mat-label>
                        <mat-select name="gander" formControlName="gender">
                            <mat-option value="Male">Male</mat-option>
                            <mat-option value="Female">Female</mat-option>
                            <mat-option value="Other">Other</mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <mat-form-field appearance="outline">
                        <mat-label>Skills</mat-label>
                        <mat-select formControlName="skillIds" multiple>
                            <mat-option *ngFor="let skill of skills" [value]="skill.id"> {{ skill.skillName }}</mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
            </div>
            <!-- <div class="row">
                <div class="col-xl-12">
                    <mat-form-field appearance="outline">
                        <mat-label>Department</mat-label>
                        <mat-select formControlName="department" name="department">
                            <mat-option value="HR">HR</mat-option>
                            <mat-option value="IT">IT</mat-option>
                            <mat-option value="Finance">Finance</mat-option>
                            <mat-option value="Marketing">Marketing</mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
                <div class="col-xl-6"></div>
            </div> -->
            <div class="button-btn" mat-dialog-actions>
                <button mat-flat-button class="edit-btn" style="border-radius: 0;">Submit</button>
            </div>
        </div>
    </form>
</div>
