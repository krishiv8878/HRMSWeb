<div class="leave-type-modal-container">
  <!-- Modal Header Bar -->
  <div class="modal-header">
    <div class="header-left">
      <div class="icon-badge">
        <mat-icon>category</mat-icon>
      </div>
      <div class="header-text">
        <h2 class="modal-title">{{ isEdit ? 'Edit Leave Type Policy' : 'Create Leave Type Policy' }}</h2>
        <p class="modal-subtitle">Configure employee time-off entitlement category and rules.</p>
      </div>
    </div>
    <button type="button" class="close-btn" (click)="onCancel()" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Form Body -->
  <form [formGroup]="leaveForm" (ngSubmit)="onSubmit()" class="leave-type-form-body">
    <!-- Leave Type Name -->
    <div class="form-group">
      <label class="field-label">Leave Category / Title <span class="required">*</span></label>
      <div class="input-wrapper">
        <mat-icon class="input-icon">label</mat-icon>
        <input
          type="text"
          formControlName="type"
          (keypress)="allowOnlyLetters($event)"
          placeholder="e.g. Earned Leave, Casual Leave, Maternity Leave"
          class="custom-input"
        />
      </div>
    </div>

    <!-- Description -->
    <div class="form-group">
      <label class="field-label">Policy Guidelines & Description <span class="required">*</span></label>
      <div class="input-wrapper-textarea">
        <mat-icon class="input-icon-textarea">notes</mat-icon>
        <textarea
          formControlName="description"
          rows="3"
          placeholder="Enter eligibility rules, notice periods, and documentation requirements..."
          class="custom-textarea"
        ></textarea>
      </div>
    </div>

    <!-- Status Switch Card -->
    <div class="status-card-group">
      <div class="status-text-left">
        <label class="status-title">Active Policy Status</label>
        <p class="status-desc">Allow employees to select and request this leave type in requests.</p>
      </div>

      <label class="switch-control">
        <input type="checkbox" formControlName="isActive" />
        <span class="slider-round"></span>
      </label>
    </div>

    <!-- Modal Footer Actions -->
    <div class="modal-footer">
      <button *ngIf="isEdit" type="button" class="btn-delete" (click)="onDeleteInModal()">
        <mat-icon>delete_outline</mat-icon>
        <span>Delete</span>
      </button>

      <button type="button" class="btn-cancel" (click)="onCancel()">
        Cancel
      </button>
      <button type="submit" class="btn-submit">
        <mat-icon>{{ isEdit ? 'save' : 'add_task' }}</mat-icon>
        <span>{{ isEdit ? 'Save Changes' : 'Add Leave Type' }}</span>
      </button>
    </div>
  </form>
</div>
