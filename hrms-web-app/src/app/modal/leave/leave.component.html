<div class="form">
    <form action="" [formGroup]="leavetype" (ngSubmit)="submitdata()">
        @if (isEdit) {
        <p>edit leaveType </p>
        }@else {
        <p>add leaveType</p>
        }
        <div class="employee-form">
            <div class="row">
                <div class="col-xl-12">
                    <mat-form-field appearance="outline">
                        <mat-label>leave type</mat-label>
                        <input type="text" matInput name="Leave" placeholder="Enter Your LeaveType" (keypress)="allowOnlyLetters($event)" (keydown.space)="$event.preventDefault()"
                            formControlName="type">
                    </mat-form-field>
                </div>

                <div class="col-xl-12">
                    <mat-form-field appearance="outline">
                        <mat-label>description</mat-label>
                        <input type="text" matInput name="description" placeholder="Enter Your Description" (keydown.space)="$event.preventDefault()"
                            formControlName="description">
                    </mat-form-field>
                </div>
            </div>



            <div class="row">
                <div class="col-xl-6">
                    <mat-checkbox formControlName="isActive">Active</mat-checkbox>
                </div>
            </div>


            @if(isEdit){
            <div class="button-btn" mat-dialog-actions>
                <button mat-flat-button class="edit-btn" style="border-radius: 0;">update</button>
                <button mat-raised-button class="cancel-btn" mat-dialog-close="false"
                    style="border-radius: 0;">cancel</button>
            </div>
            }@else {
            <div class="button-btn">
                <button mat-flat-button class="edit-btn" routerLink="createdDate" style="border-radius: 0;">add</button>
                <button mat-raised-button class="cancel-btn" mat-dialog-close="false"
                    style="border-radius: 0;">cancel</button>
            </div>
            }


        </div>
    </form>
</div>
