<div class="leave-type-modal-card">
  <!-- Modal Header Bar -->
  <div class="modal-header">
    <div class="header-title">
      <div class="icon-box">
        <mat-icon>category</mat-icon>
      </div>
      <div>
        <h2>{{ isEdit ? 'Edit Leave Type' : 'Add New Leave Type' }}</h2>
        <span class="subtitle">Configure employee leave quota & policy settings.</span>
      </div>
    </div>
    <button type="button" class="close-top-btn" (click)="onCancel()" aria-label="Close modal">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Form Body -->
  <form [formGroup]="leaveForm" (ngSubmit)="onSubmit()" class="form-body">
    <!-- Leave Type Name -->
    <div class="form-group">
      <label class="form-label">Leave Type Name <span class="required">*</span></label>
      <input
        type="text"
        formControlName="type"
        (keypress)="allowOnlyLetters($event)"
        placeholder="e.g., Earned Leave, Casual Leave, Sick Leave"
        class="form-input"
      />
    </div>

    <!-- Description -->
    <div class="form-group">
      <label class="form-label">Policy Description <span class="required">*</span></label>
      <textarea
        formControlName="description"
        rows="3"
        placeholder="Enter leave policy terms, eligibility, or documentation guidelines..."
        class="form-textarea"
      ></textarea>
    </div>

    <!-- Status Toggle Option -->
    <div class="form-group status-checkbox-group">
      <label class="checkbox-label">
        <input type="checkbox" formControlName="isActive" class="form-checkbox" />
        <span class="checkbox-text">Set Leave Type as Active</span>
      </label>
    </div>

    <!-- Bottom Actions -->
    <div class="form-actions">
      <button *ngIf="isEdit" type="button" class="btn-delete" (click)="onDeleteInModal()">
        <mat-icon>delete_outline</mat-icon>
        <span>Delete</span>
      </button>

      <button type="button" class="btn-cancel" (click)="onCancel()">
        Cancel
      </button>
      <button type="submit" class="btn-submit">
        <mat-icon class="btn-icon">save</mat-icon>
        <span>{{ isEdit ? 'Save Changes' : 'Add Leave Type' }}</span>
      </button>
    </div>
  </form>
</div>
