<div class="form">
    <form action="" [formGroup]="leavetype" (ngSubmit)="submitdata()">
        @if (isEdit) {
        <p>edit leaveType </p>
        }@else {
        <p>add leaveType</p>
        }
        <div class="employee-form">
            <div class="row">
                <div class="col">
                    <mat-form-field appearance="outline">
                        <mat-label>leave type</mat-label>
                        <input type="text" matInput name="Leave" placeholder="Enter Your LeaveType"
                            formControlName="type">
                            <mat-error *ngIf="getControl('type')?.hasError('required')">LeaveType is
                                required</mat-error>
                    </mat-form-field>
                </div>

                <!-- <div class="col-xl-6">
                    <mat-form-field appearance="outline">
                        <mat-label>leaveType</mat-label>                        
                        <mat-select formControlName="type">
                            <mat-option value="Casualleave">Casual leave </mat-option>
                            <mat-option value="Sickleave">Sick leave</mat-option>
                            <mat-option value="Annualleave">Annual leave</mat-option>
                            <mat-option value="Paternityleaves">Paternity leaves</mat-option>
                        </mat-select>
                    </mat-form-field>
                </div> -->
            </div>           

            <div class="row">
                <div class="col">
                    <mat-form-field appearance="outline">
                        <mat-label>description</mat-label>
                        <input type="text" matInput name="description" placeholder="Enter Your Description"
                            formControlName="description">
                            <mat-error *ngIf="getControl('description')?.hasError('required')">description is
                                required</mat-error>
                    </mat-form-field>
                </div>
            </div>

            <div class="row">
                <div class="col-xl-6">
                    <mat-checkbox formControlName="isActive">Active</mat-checkbox>
                </div>
            </div>


            @if(isEdit){
            <div class="button-btn" mat-dialog-actions>
                <button mat-flat-button class="edit-btn">update</button>
                <button mat-raised-button class="cancel-btn" mat-dialog-close="false">cancel</button>
            </div>
            }@else {
            <div class="button-btn">
                <button mat-flat-button class="edit-btn" routerLink="createdDate">add</button>
                <button mat-raised-button class="cancel-btn" mat-dialog-close="false">cancel</button>
            </div>
            }


        </div>
    </form>
</div>
